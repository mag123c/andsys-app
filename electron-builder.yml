appId: net.4ndsys.app
productName: 4ndSYS
copyright: Copyright © 2026 4ndSYS

directories:
  buildResources: build
  output: release/${version}

files:
  - dist-electron/**/*
  - out/**/*

extraMetadata:
  main: dist-electron/main.js

# 자동 업데이트 설정
publish:
  provider: github
  owner: mag123c
  repo: andsys-app
  releaseType: release

# macOS 설정
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  # 코드 서명 (Apple Developer Program 필요)
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  hardenedRuntime: true
  gatekeeperAssess: false

# macOS DMG 설정
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows 설정
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # 코드 서명 (EV Code Signing Certificate 필요)
  # certificateSubjectName: "Your Company Name"

# Windows NSIS 인스톨러 설정
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # 한국어 포함
  installerLanguages:
    - en_US
    - ko_KR
  language: "1042" # 한국어

# Linux 설정
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Office
  maintainer: support@4ndsys.net

# 딥링크 프로토콜 등록
protocols:
  - name: 4ndSYS
    schemes:
      - "4ndsys"

# 파일 연결 (선택)
